services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: mongodb://mongo:27017/faysal_portfolio
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@faysaljoy.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5050}
    ports:
      - '5050:5050'
    volumes:
      - uploads:/app/server/uploads

volumes:
  mongo-data:
  uploads:
